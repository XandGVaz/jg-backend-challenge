worker_processes auto;

events {
  worker_connections 1024;
}

http {
  log_format json escape=json '{"time":"$time_iso8601","requestId":"$correlation_id","method":"$request_method","uri":"$request_uri","status":$status,"upstream":"$upstream_addr","durationMs":$request_time}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  # Preserva o X-Request-Id do cliente; gera um novo só quando ele não vem.
  map $http_x_request_id $correlation_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  # DNS interno do Docker: reavalia as réplicas da api ao escalar.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream api {
    zone api 64k;
    server api:3000 resolve;
    keepalive 32;
  }

  server {
    listen 80;
    client_max_body_size 1m;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $correlation_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Só falha de conexão troca de réplica: 503 da api é resposta de negócio (falha transitória).
      proxy_next_upstream error timeout;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
    }
  }
}
