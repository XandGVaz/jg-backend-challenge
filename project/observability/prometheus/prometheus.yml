global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # honor_labels mantém job=service.name e instance=service.instance.id vindos do OTel.
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
